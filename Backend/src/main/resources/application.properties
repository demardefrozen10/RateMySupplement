spring.application.name=v1
springdoc.swagger-ui.path=/


server.port=${PORT:8080}

# Supabase session pooler (IPv4 compatible); password comes from DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.fdzudamxdmjdbbvwkcyy}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=update

#Tells spring.jpa.hibernate (ORM) how to handle database schema on start
spring.jpa.show-sql=true
#Log all SQL statements (Or not if false)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Which SQL dialect to use?
# Which SQL dialect to use?



aws.s3.bucket-name=${S3_BUCKET:ratemysupplements}
aws.s3.region=${S3_REGION:us-east-2}

aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_KEY}


# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Seed brands/supplements on startup (set SEED_DATA=true once, then unset)
app.seed.enabled=${SEED_DATA:false}